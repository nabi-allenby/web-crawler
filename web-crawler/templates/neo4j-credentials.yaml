{{- /*
The manager and feeder deployments both consume a secret named by their
`secretName` value (default "neo4j-credentials") for NEO4J_USERNAME and
NEO4J_PASSWORD. Nothing in the chart created it, so both workloads failed with
CreateContainerConfigError: secret "neo4j-credentials" not found.

The credentials derive from the same values the Neo4j subchart uses, so the two
stay in sync. Set `neo4j.existingSecret` to skip this and point the workloads at
a secret you manage yourself.
*/ -}}
{{- if not .Values.neo4j.existingSecret }}
{{- $names := list }}
{{- if .Values.manager.enabled }}
{{- $names = append $names (.Values.manager.secretName | default "neo4j-credentials") }}
{{- end }}
{{- if .Values.feeder.enabled }}
{{- $names = append $names (.Values.feeder.secretName | default "neo4j-credentials") }}
{{- end }}
{{- $username := .Values.neo4j.neo4j.username | default "neo4j" }}
{{- $password := required "neo4j.neo4j.password is required unless neo4j.existingSecret is set" .Values.neo4j.neo4j.password }}
{{- range $name := ($names | uniq) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
type: Opaque
stringData:
  NEO4J_USERNAME: {{ $username | quote }}
  NEO4J_PASSWORD: {{ $password | quote }}
{{- end }}
{{- end }}
