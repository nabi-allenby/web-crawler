name: Release & Publish

on:
  push:
    branches: ["master"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/nabi-allenby/web-crawler

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Type check
        run: cd frontend && npm run type-check

      - name: Build
        run: cd frontend && npm run build

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      feeder_version: ${{ steps.feeder.outputs.version }}
      manager_version: ${{ steps.manager.outputs.version }}
      frontend_version: ${{ steps.frontend.outputs.version }}
      chart_version: ${{ steps.chart.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate feeder version
        id: feeder
        run: |
          SERVICE="feeder"
          PREFIX="${SERVICE}/v"
          LAST_TAG=$(git tag -l "${PREFIX}*" --sort=-v:refname | head -1)

          if [ -z "$LAST_TAG" ]; then
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get conventional commits since last tag touching feeder/ or shared/
          COMMITS=$(git log "$LAST_TAG"..HEAD --format="%s" -- feeder/ shared/)
          if [ -z "$COMMITS" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Parse current version
          CURRENT="${LAST_TAG#$PREFIX}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          # Determine bump from conventional commits
          if echo "$COMMITS" | grep -qE '^[a-z]+(\(.+\))?!:'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Calculate manager version
        id: manager
        run: |
          SERVICE="manager"
          PREFIX="${SERVICE}/v"
          LAST_TAG=$(git tag -l "${PREFIX}*" --sort=-v:refname | head -1)

          if [ -z "$LAST_TAG" ]; then
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMITS=$(git log "$LAST_TAG"..HEAD --format="%s" -- manager/ shared/)
          if [ -z "$COMMITS" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT="${LAST_TAG#$PREFIX}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if echo "$COMMITS" | grep -qE '^[a-z]+(\(.+\))?!:'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Calculate frontend version
        id: frontend
        run: |
          SERVICE="frontend"
          PREFIX="${SERVICE}/v"
          LAST_TAG=$(git tag -l "${PREFIX}*" --sort=-v:refname | head -1)

          if [ -z "$LAST_TAG" ]; then
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMITS=$(git log "$LAST_TAG"..HEAD --format="%s" -- frontend/)
          if [ -z "$COMMITS" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT="${LAST_TAG#$PREFIX}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if echo "$COMMITS" | grep -qE '^[a-z]+(\(.+\))?!:'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Calculate chart version
        id: chart
        run: |
          PREFIX="chart/v"
          LAST_TAG=$(git tag -l "${PREFIX}*" --sort=-v:refname | head -1)

          if [ -z "$LAST_TAG" ]; then
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMITS=$(git log "$LAST_TAG"..HEAD --format="%s" -- web-crawler/)
          if [ -z "$COMMITS" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT="${LAST_TAG#$PREFIX}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if echo "$COMMITS" | grep -qE '^[a-z]+(\(.+\))?!:'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"


  build-feeder:
    needs: release
    if: needs.release.outputs.feeder_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: feeder/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/feeder:${{ needs.release.outputs.feeder_version }}
            ${{ env.IMAGE_PREFIX }}/feeder:latest

  build-manager:
    needs: release
    if: needs.release.outputs.manager_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: manager/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/manager:${{ needs.release.outputs.manager_version }}
            ${{ env.IMAGE_PREFIX }}/manager:latest

  build-frontend:
    needs: [release, frontend-ci]
    if: needs.release.outputs.frontend_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ needs.release.outputs.frontend_version }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest

  publish-chart:
    needs: release
    if: needs.release.outputs.chart_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Add Helm repositories
        run: helm repo add neo4j https://helm.neo4j.com/neo4j

      - name: Build Helm dependencies
        run: helm dependency build web-crawler

      - name: Package Helm chart
        run: helm package web-crawler --version ${{ needs.release.outputs.chart_version }}

      - name: Push Helm chart to GHCR
        run: helm push web-crawler-${{ needs.release.outputs.chart_version }}.tgz oci://${{ env.IMAGE_PREFIX }}/charts

  # Tags are created only after the corresponding artifact is actually
  # published. Tagging in the release job meant a failed build still moved the
  # tag forward; the next run then found no new commits for that service, set
  # an empty version, and skipped the build permanently. That is how
  # frontend/v1.1.0 came to exist with no frontend image behind it.
  tag:
    needs: [release, build-feeder, build-manager, build-frontend, publish-chart]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create git tags for published artifacts
        env:
          FEEDER_VERSION: ${{ needs.release.outputs.feeder_version }}
          MANAGER_VERSION: ${{ needs.release.outputs.manager_version }}
          FRONTEND_VERSION: ${{ needs.release.outputs.frontend_version }}
          CHART_VERSION: ${{ needs.release.outputs.chart_version }}
          FEEDER_RESULT: ${{ needs.build-feeder.result }}
          MANAGER_RESULT: ${{ needs.build-manager.result }}
          FRONTEND_RESULT: ${{ needs.build-frontend.result }}
          CHART_RESULT: ${{ needs.publish-chart.result }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          tagged=0
          tag_if_published() {
            PREFIX="$1"; VERSION="$2"; RESULT="$3"

            # No version means there was nothing to release for this service.
            if [ -z "$VERSION" ]; then
              echo "Skipping ${PREFIX}: no new version"
              return 0
            fi

            if [ "$RESULT" != "success" ]; then
              echo "NOT tagging ${PREFIX}${VERSION}: publish job result was '${RESULT}'"
              return 0
            fi

            git tag "${PREFIX}${VERSION}"
            echo "Tagged ${PREFIX}${VERSION}"
            tagged=1
          }

          tag_if_published "feeder/v"   "$FEEDER_VERSION"   "$FEEDER_RESULT"
          tag_if_published "manager/v"  "$MANAGER_VERSION"  "$MANAGER_RESULT"
          tag_if_published "frontend/v" "$FRONTEND_VERSION" "$FRONTEND_RESULT"
          tag_if_published "chart/v"    "$CHART_VERSION"    "$CHART_RESULT"

          if [ "$tagged" -eq 1 ]; then
            git push --tags
          else
            echo "No tags to push"
          fi
